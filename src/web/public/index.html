<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="kru-desktop" content="__KRU_DESKTOP__" />
    <meta name="kru-token" content="__KRU_TOKEN__" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>KRU · Agent workspace</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="desktop-titlebar" aria-hidden="true"></div>
    <section id="auth-gate" aria-label="Sign in to Kru" hidden>
      <p role="status">Checking your account…</p>
    </section>
    <div id="app" class="workspace">
      <aside class="sidebar" aria-label="Workspace navigation">
        <a class="wordmark" href="/" aria-label="KRU home"
          ><span class="brand-mark">k</span><span class="brand-name">kru</span
          ><span class="local-label">LOCAL</span></a
        >
        <div class="workspace-label">YOUR WORKSPACE</div>
        <nav id="navigation" aria-label="Views"></nav>
        <div class="team-heading">
          <span>Teammates</span
          ><button
            class="icon-button"
            data-action="new-agent"
            aria-label="Create teammate"
            title="Create teammate"
          >
            +
          </button>
        </div>
        <div id="agents" class="agent-list"></div>
        <div class="sidebar-bottom">
          <div id="usage-limits" class="usage-limits" aria-label="Provider usage limits"></div>
          <div
            id="usage-limits-menu"
            class="usage-limits-menu"
            popover
            aria-label="Usage limits"
          ></div>
          <div id="account" class="account-control" aria-label="Kru account" hidden></div>
          <div class="appearance-control">
            <button
              id="theme-trigger"
              class="theme-trigger"
              type="button"
              popovertarget="theme-menu"
              aria-haspopup="menu"
              aria-label="Theme: System"
              title="Theme: System"
            >
              <span class="theme-trigger-icon" aria-hidden="true"></span
              ><span class="theme-trigger-label">Appearance</span>
            </button>
            <div id="theme-menu" class="theme-menu" popover role="menu" aria-label="Appearance">
              <p>Appearance</p>
              <button
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-theme-choice="light"
              >
                <span class="theme-option-icon" aria-hidden="true"></span><span>Light</span
                ><span class="theme-option-check" aria-hidden="true"></span>
              </button>
              <button
                type="button"
                role="menuitemradio"
                aria-checked="false"
                data-theme-choice="dark"
              >
                <span class="theme-option-icon" aria-hidden="true"></span><span>Dark</span
                ><span class="theme-option-check" aria-hidden="true"></span>
              </button>
              <button
                type="button"
                role="menuitemradio"
                aria-checked="true"
                data-theme-choice="system"
              >
                <span class="theme-option-icon" aria-hidden="true"></span
                ><span>System<small>Follow device appearance</small></span
                ><span class="theme-option-check" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <span id="connection" class="connection">Connecting</span
          ><span>Local engine · v0.1.1</span>
        </div>
      </aside>
      <main>
        <button
          class="icon-button mobile-menu"
          data-action="menu"
          aria-label="Toggle navigation"
          aria-controls="navigation"
          aria-expanded="false"
        >
          ☰
        </button>
        <div id="banner" role="status" hidden></div>
        <div id="attention-reminder" role="status" hidden></div>
        <div class="workspace-body">
          <section id="content" aria-live="polite">
            <div class="loading">Connecting to your workspace…</div>
          </section>
          <aside id="browser-panel" class="browser-panel" aria-label="Browser panel" hidden></aside>
        </div>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    <input id="chat-files" type="file" multiple hidden />
    <input id="chat-folder" type="file" webkitdirectory directory multiple hidden />
    <div id="toast" role="status" hidden></div>
  </body>
</html>
